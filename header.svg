<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title description">
  <title id="title">Biruk Yonas — software developer</title>
  <desc id="description">A deep navy banner with a subtle blue and teal gradient accent.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#2dd4bf"/>
    </linearGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#94a3b8" opacity=".18"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" rx="24" fill="url(#background)"/>
  <rect width="1200" height="320" rx="24" fill="url(#dots)"/>
  <circle cx="1030" cy="-20" r="230" fill="#2563eb" opacity=".13"/>
  <circle cx="1110" cy="300" r="190" fill="#14b8a6" opacity=".12"/>
  <path d="M0 278 C250 238 410 312 650 270 S1000 244 1200 278" fill="none" stroke="url(#accent)" stroke-width="2" opacity=".5"/>
  <rect x="76" y="72" width="5" height="176" rx="2.5" fill="url(#accent)"/>
  <text x="108" y="142" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="48" font-weight="700" letter-spacing="-1">Building thoughtful software.</text>
  <text x="110" y="190" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22" font-weight="400">Web · Mobile · Security</text>
  <text x="110" y="232" fill="#7dd3fc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15" font-weight="600" letter-spacing="2">BIRUK YONAS  /  ETHIOPIA</text>
</svg>
