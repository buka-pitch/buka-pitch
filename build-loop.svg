      <path d="m0 95 15 6v11c0 11-7 18-15 22-8-4-15-11-15-22v-11Zm-7 17 5 5 10-11" fill="none" stroke="#5eead4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="181" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="700">Secure</text>
      <text x="0" y="205" text-anchor="middle" fill="#94a3b8" font-size="13">Consider the edges</text>
      <text x="0" y="48" text-anchor="middle" fill="#5eead4" font-size="11" font-weight="700" letter-spacing="2">03</text>
