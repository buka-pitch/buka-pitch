      <text x="0" y="181" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="700">Understand</text>
      <text x="0" y="205" text-anchor="middle" fill="#94a3b8" font-size="13">Start with the problem</text>
      <text x="0" y="48" text-anchor="middle" fill="#7dd3fc" font-size="11" font-weight="700" letter-spacing="2">01</text>
    </g>
    <g transform="translate(418 0)">
      <circle cx="0" cy="112" r="35" fill="#0b1220" stroke="#38bdf8" stroke-width="2"/>
      <path d="m-10 101-11 11 11 11m20-22 11 11-11 11m-3-28-8 32" fill="none" stroke="#7dd3fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="181" text-anchor="middle" fill="#e2e8f0" font-size="17" font-weight="700">Build</text>
      <text x="0" y="205" text-anchor="middle" fill="#94a3b8" font-size="13">Make it useful</text>
      <text x="0" y="48" text-anchor="middle" fill="#7dd3fc" font-size="11" font-weight="700" letter-spacing="2">02</text>
    </g>
    <g transform="translate(682 0)">
